[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynetviz"
version = "2.0.0"
description = "Real-time Network Connections Visualizer and Analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.25.0",
    "psutil>=6.0.0",
    "requests>=2.31.0",
    "geoip2>=4.8.0",
    "Pillow>=10.0.0",
    "pystray>=0.19.5",
]

[project.scripts]
pynetviz = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pynetviz*"]